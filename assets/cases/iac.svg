<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="iac"><style>{`
    .cv-flow { animation: cv-flow 1.6s linear infinite; }
    @keyframes cv-flow { to { stroke-dashoffset: -24; } }
    .cv-pulse { animation: cv-pulse 2.4s ease-in-out infinite; }
    @keyframes cv-pulse { 50% { opacity: 0.45; } }
    .cv-blink { animation: cv-blink 1.4s steps(1) infinite; }
    @keyframes cv-blink { 50% { opacity: 0.2; } }
    .cv-d1 { animation-delay: .3s; } .cv-d2 { animation-delay: .6s; } .cv-d3 { animation-delay: .9s; } .cv-d4 { animation-delay: 1.2s; }
    @media (prefers-reduced-motion: reduce) { .cv-flow, .cv-pulse, .cv-blink { animation: none; } }
  `}</style><defs><linearGradient id="iac-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1220"></stop><stop offset="1" stop-color="#080b13"></stop></linearGradient><linearGradient id="iac-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"></stop><stop offset="0.55" stop-color="#818cf8"></stop><stop offset="1" stop-color="#c084fc"></stop></linearGradient><radialGradient id="iac-glow" cx="0.7" cy="0.35" r="0.6"><stop offset="0" stop-color="#818cf8" stop-opacity="0.35"></stop><stop offset="1" stop-color="#818cf8" stop-opacity="0"></stop></radialGradient><radialGradient id="iac-glow2" cx="0.2" cy="0.8" r="0.55"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"></stop><stop offset="1" stop-color="#22d3ee" stop-opacity="0"></stop></radialGradient><pattern id="iac-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"></path></pattern><clipPath id="iac-clip"><rect width="800" height="450" rx="20"/></clipPath></defs><g clip-path="url(#iac-clip)"><rect width="800" height="450" rx="20" fill="url(#iac-bg)"></rect><rect width="800" height="450" fill="url(#iac-grid)"></rect><rect width="800" height="450" fill="url(#iac-glow)"></rect><rect width="800" height="450" fill="url(#iac-glow2)"></rect><g font-family="JetBrains Mono Variable, JetBrains Mono, Fira Code, Menlo, Consolas, monospace"><g transform="translate(50 50)"><rect width="460" height="300" rx="16" fill="#0f1729" stroke="#94a3b8" stroke-opacity="0.25"></rect><circle cx="20" cy="20" r="5" fill="#f87171"></circle><circle cx="36" cy="20" r="5" fill="#fbbf24"></circle><circle cx="52" cy="20" r="5" fill="#34d399"></circle><line x1="0" y1="38" x2="460" y2="38" stroke="#94a3b8" stroke-opacity="0.15"></line><g font-size="13.5"><text x="20" y="70" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> terraform plan</text><text x="20" y="100" fill="#34d399">+ module.cluster.kubernetes_cluster</text><text x="20" y="124" fill="#34d399">+ module.network.private_endpoint</text><text x="20" y="148" fill="#fbbf24">~ module.dns.record["api"]</text><text x="20" y="178" fill="#cbd5e1">Plan: <tspan fill="#34d399">2 to add</tspan>, <tspan fill="#fbbf24">1 to change</tspan>, 0 to destroy.</text><text x="20" y="214" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> kustomize build overlays/production</text><text x="20" y="244" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> terraform apply</text><text x="20" y="272" fill="#34d399">Apply complete!<tspan class="cv-blink" fill="#22d3ee"> ▍</tspan></text></g></g><g><path d="M590 132 L590 188" stroke="url(#iac-grad)" stroke-width="3" stroke-dasharray="6 6" class="cv-flow"></path><rect x="545" y="88" width="190" height="44" rx="12" fill="#0f1729" stroke="#818cf8" stroke-opacity="0.6"></rect><circle cx="570" cy="110" r="6" fill="#818cf8" class="cv-pulse cv-d1"></circle><text x="588" y="115" font-size="14" fill="#e2e8f0">commit</text></g><g><path d="M590 212 L590 268" stroke="url(#iac-grad)" stroke-width="3" stroke-dasharray="6 6" class="cv-flow"></path><rect x="545" y="168" width="190" height="44" rx="12" fill="#0f1729" stroke="#818cf8" stroke-opacity="0.6"></rect><circle cx="570" cy="190" r="6" fill="#818cf8" class="cv-pulse cv-d2"></circle><text x="588" y="195" font-size="14" fill="#e2e8f0">build</text></g><g><path d="M590 292 L590 348" stroke="url(#iac-grad)" stroke-width="3" stroke-dasharray="6 6" class="cv-flow"></path><rect x="545" y="248" width="190" height="44" rx="12" fill="#0f1729" stroke="#818cf8" stroke-opacity="0.6"></rect><circle cx="570" cy="270" r="6" fill="#818cf8" class="cv-pulse cv-d3"></circle><text x="588" y="275" font-size="14" fill="#e2e8f0">staging</text></g><g><rect x="545" y="328" width="190" height="44" rx="12" fill="#0f1729" stroke="#34d399" stroke-opacity="0.6"></rect><circle cx="570" cy="350" r="6" fill="#34d399" class="cv-pulse cv-d4"></circle><text x="588" y="355" font-size="14" fill="#e2e8f0">production