<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="iac"><style>{`
    .cv-flow { animation: cv-flow 1.6s linear infinite; }
    @keyframes cv-flow { to { stroke-dashoffset: -24; } }
    .cv-pulse { animation: cv-pulse 2.4s ease-in-out infinite; }
    @keyframes cv-pulse { 50% { opacity: 0.45; } }
    .cv-blink { animation: cv-blink 1.4s steps(1) infinite; }
    @keyframes cv-blink { 50% { opacity: 0.2; } }
    .cv-d1 { animation-delay: .3s; } .cv-d2 { animation-delay: .6s; } .cv-d3 { animation-delay: .9s; } .cv-d4 { animation-delay: 1.2s; }
    @media (prefers-reduced-motion: reduce) { .cv-flow, .cv-pulse, .cv-blink { animation: none; } }
  `}</style><defs><linearGradient id="iac-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1220"></stop><stop offset="1" stop-color="#080b13"></stop></linearGradient><linearGradient id="iac-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"></stop><stop offset="0.55" stop-color="#818cf8"></stop><stop offset="1" stop-color="#c084fc"></stop></linearGradient><radialGradient id="iac-glow" cx="0.7" cy="0.35" r="0.6"><stop offset="0" stop-color="#818cf8" stop-opacity="0.35"></stop><stop offset="1" stop-color="#818cf8" stop-opacity="0"></stop></radialGradient><radialGradient id="iac-glow2" cx="0.2" cy="0.8" r="0.55"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"></stop><stop offset="1" stop-color="#22d3ee" stop-opacity="0"></stop></radialGradient><pattern id="iac-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"></path></pattern><clipPath id="iac-clip"><rect width="800" height="450" rx="20"/></clipPath></defs><g clip-path="url(#iac-clip)"><rect width="800" height="450" rx="20" fill="url(#iac-bg)"></rect><rect width="800" height="450" fill="url(#iac-grid)"></rect><rect width="800" height="450" fill="url(#iac-glow)"></rect><rect width="800" height="450" fill="url(#iac-glow2)"></rect><g font-family="JetBrains Mono Variable, JetBrains Mono, Fira Code, Menlo, Consolas, monospace"><g transform="translate(50 60)"><rect width="400" height="290" rx="16" fill="#0f1729" stroke="#94a3b8" stroke-opacity="0.25"></rect><circle cx="20" cy="20" r="5" fill="#f87171"></circle><circle cx="36" cy="20" r="5" fill="#fbbf24"></circle><circle cx="52" cy="20" r="5" fill="#34d399"></circle><line x1="0" y1="38" x2="400" y2="38" stroke="#94a3b8" stroke-opacity="0.15"></line><g font-size="13"><text x="20" y="70" fill="#a78bfa">module <tspan fill="#fcd34d">"cluster"</tspan> {</text><text x="38" y="94" fill="#cbd5e1">source  = <tspan fill="#fcd34d">"./modules/k8s"</tspan></text><text x="38" y="118" fill="#cbd5e1">env     = <tspan fill="#fcd34d">var.env</tspan></text><text x="38" y="142" fill="#cbd5e1">regions = <tspan fill="#fcd34d">["primary", "dr"]</tspan></text><text x="20" y="166" fill="#a78bfa">}</text><text x="20" y="206" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> terraform apply</text><text x="20" y="232" fill="#cbd5e1">Plan: <tspan fill="#34d399">3 to add</tspan>, 0 to destroy.</text><text x="20" y="258" fill="#34d399">Apply complete!<tspan class="cv-blink" fill="#22d3ee"> ▍</tspan></text></g></g><g><path d="M450 205 C 510 205, 520 110, 560 110" fill="none" stroke="url(#iac-grad)" stroke-width="2.5" stroke-dasharray="6 6" class="cv-flow"></path><g transform="translate(560 80)"><rect width="180" height="60" rx="14" fill="#0f1729" stroke="#ff9900" stroke-opacity="0.6"></rect><circle cx="26" cy="30" r="8" fill="#ff9900" class="cv-pulse cv-d1"></circle><text x="46" y="35" font-size="15" fill="#e2e8f0">AWS</text><text x="166" y="35" text-anchor="end" font-size="11" fill="#34d399">✓ in sync</text></g></g><g><path d="M450 205 C 510 205, 520 205, 560 205" fill="none" stroke="url(#iac-grad)" stroke-width="2.5" stroke-dasharray="6 6" class="cv-flow"></path><g transform="translate(560 175)"><rect width="180" height="60" rx="14" fill="#0f1729" stroke="#3ba0ff" stroke-opacity="0.6"></rect><circle cx="26" cy="30" r="8" fill="#3ba0ff" class="cv-pulse cv-d2"></circle><text x="46" y="35" font-size="15" fill="#e2e8f0">Azure</text><text x="166" y="35" text-anchor="end" font-size="11" fill="#34d399">✓ in sync</text></g></g><g><path d="M450 205 C 510 205, 520 300, 560 300" fill="none" stroke="url(#iac-grad)" stroke-width="2.5" stroke-dasharray="6 6" class="cv-flow"></path><g transform="translate(560 270)"><rect width="180" height="60" rx="14" fill="#0f1729" stroke="#4285f4" stroke-opacity="0.6"></rect><circle cx="26" cy="30" r="8" fill="#4285f4" class="cv-pulse cv-d3"></circle><text x="46" y="35" font-size="15" fill="#e2e8f0">GCP</text><text x="166" y="35" text-anchor="end" font-size="11" fill="#34d399">✓ in sync</text></g></g></g></g><rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="none" stroke="#94a3b8" stroke-opacity="0.25"/></svg>